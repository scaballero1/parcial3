# Configuración de la aplicación "Exámenes de Sangre".
# Cada propiedad puede sobrescribirse al ejecutar con -D, por ejemplo:
#   mvn javafx:run -Dvalidacion.modo=basica -Dpersistencia.archivo=/tmp/examenes.dat

# Archivo donde "Serializar" guarda y "Deserializar" recupera los exámenes.
persistencia.archivo=data/examenes.dat

# Política de validación (patrón Strategy): estricta | basica
validacion.modo=estricta
